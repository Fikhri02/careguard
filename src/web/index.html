<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Widget</title>
<style>
  :root { color-scheme: light dark; --bg:#0b0c10; --panel:#16181d; --me:#2563eb; --bot:#23262d; --text:#e8eaed; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:640px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 18px; font-weight:600; border-bottom:1px solid #2a2d34; }
  header small { display:block; font-weight:400; color:#9aa0a6; }
  #log { flex:1; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 13px; border-radius:14px; max-width:82%; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .tip { align-self:center; color:#9aa0a6; font-size:13px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #2a2d34; }
  input { flex:1; padding:11px 13px; border-radius:10px; border:1px solid #2a2d34; background:var(--panel); color:var(--text); font-size:15px; }
  button { padding:0 15px; border:0; border-radius:10px; background:var(--me); color:#fff; font-size:15px; cursor:pointer; }
  button.mic { background:var(--panel); border:1px solid #2a2d34; }
  button.mic.on { background:#dc2626; }
</style>
</head>
<body>
<div class="wrap">
  <header>Your agent, embedded <small>This widget is a "surface" — drop it in any app. Voice 🎤 works in Chrome.</small></header>
  <div id="log"><div class="tip">Say hi, or ask something current — it can search the web.</div></div>
  <form id="f">
    <button type="button" class="mic" id="mic" title="Voice input">🎤</button>
    <input id="q" placeholder="Message the agent…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>
<script>
  const API = location.origin + "/agent";
  const log = document.getElementById("log");
  const messages = [];

  function add(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + (role === "user" ? "me" : "bot");
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function send(text) {
    add("user", text);
    messages.push({ role: "user", content: text });
    const thinking = add("assistant", "…");
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await res.json();
      thinking.textContent = data.reply || data.error || "(no reply)";
      if (data.messages) { messages.length = 0; messages.push(...data.messages); }
    } catch (e) {
      thinking.textContent = "Error: " + e.message;
    }
  }

  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = document.getElementById("q");
    if (q.value.trim()) { send(q.value.trim()); q.value = ""; }
  });

  // Voice input via Web Speech API — the "voice interface" surface, for free.
  const mic = document.getElementById("mic");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const rec = new SR();
    rec.lang = "en-US";
    mic.addEventListener("click", () => { mic.classList.add("on"); rec.start(); });
    rec.onresult = (ev) => { const t = ev.results[0][0].transcript; mic.classList.remove("on"); send(t); };
    rec.onend = () => mic.classList.remove("on");
  } else {
    mic.style.display = "none";
  }
</script>
</body>
</html>
